
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Pago realizado | Centuria Sea Adventure</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f3f6f5;
      color: #173b46;
    }

    .contenedor {
      width: 100%;
      max-width: 560px;
      padding: 44px 28px;
      text-align: center;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 35px rgba(15, 60, 75, 0.10);
    }

    .icono {
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #e1f4eb;
      color: #18794e;
      font-size: 42px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(26px, 5vw, 36px);
    }

    p {
      margin: 0 auto 16px;
      max-width: 430px;
      line-height: 1.7;
      color: #536970;
    }

    .boton {
      display: inline-block;
      margin-top: 16px;
      padding: 15px 24px;
      border-radius: 7px;
      background: #d8461f;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .boton:hover {
      background: #b93616;
    }

    .marca {
      margin-top: 30px;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #71858b;
    }
  </style>
</head>
<body>
  <main class="contenedor">
    <div class="icono" aria-hidden="true">✓</div>

    <h1>¡Pago realizado correctamente!</h1>

    <p>
      Gracias por confiar en Centuria Sea Adventure.
      Hemos recibido el pago de tu fianza.
    </p>

    <p>
      Si necesitamos confirmar algún detalle de tu reserva,
      nos pondremos en contacto contigo.
    </p>

    <a class="boton" href="index.html">Volver a la página principal</a>

    <div class="marca">Centuria Sea Adventure</div>
  </main>
</body>
</html>
